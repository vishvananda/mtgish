[package]
name = "rust_syntax"
version = "0.0.1"
edition = "2021"

[workspace]
members = ["normalize"]
resolver = "2"

[dependencies]
# Serialize/Deserialize, needed for RON
serde = { version = "1.0.217", features = ["derive"] }

# Adds skip_serializing_if, and unwrap_or_skip
serde_with = "3.12.0"

# Serde input/output formats
serde_json = "1.0.134"
ron = "0.8.1"

# Typescript types from Rust types
ts-rs = { version = "10.1", features = ["no-serde-warnings"] }

# Non-Serde binary Serialize/Deserialize
bincode = "2.0.1"
sha2 = "0.10"

[profile.dev]
incremental = true
debug = 0

# Optimized dependencies make corpus runs fast, and dropping debug assertions
# removes standard library checks from hot generic code (syn, serde_json).
[profile.dev.package."*"]
opt-level = 2
debug-assertions = false
overflow-checks = false

# At opt-level 1 `ast cantrip-tracked` takes about 215 s of CPU against 300 s at
# 0, and on 2026-11-02 a one-file edit rebuilt `ast` in 18-20 s against 19-27 s
# and the test binaries in 13-15 s against 16-22 s. Measure the edit-and-run
# loop before going higher: the crate is large, and opt-level 2 is untried.
[profile.dev.package.mtgish-ast]
opt-level = 1
debug-assertions = false

[features]
legacy-cli = []
ronl_to_bincode = ["legacy-cli"]
ronl_to_pretty_ron = ["legacy-cli"]
write_out_json = ["legacy-cli"]

[[bin]]
name = "rust_syntax"
path = "src/main.rs"
required-features = ["legacy-cli"]
