[package]
name = "rust_syntax"
version = "0.0.1"
edition = "2021"

[workspace]
members = ["normalize"]
resolver = "2"

[dependencies]
# Serialize/Deserialize, needed for RON
serde = { version = "1.0.217", features = ["derive"] }

# Adds skip_serializing_if, and unwrap_or_skip
serde_with = "3.12.0"

# Serde input/output formats
serde_json = "1.0.134"
ron = "0.8.1"

# Typescript types from Rust types
ts-rs = { version = "10.1", features = ["no-serde-warnings"] }

# Non-Serde binary Serialize/Deserialize
bincode = "2.0.1"
sha2 = "0.10"

[profile.dev]
incremental = true
debug = 0

# Optimized dependencies make corpus runs fast, and dropping debug assertions
# removes standard library checks from hot generic code. Do not raise opt-level
# on mtgish-ast: on 2026-11-02 at 1 it cut `ast cantrip-tracked` from 1003 G
# instructions to 866 G, but an edit to one function rebuilt `ast` in 51 s
# against 22-24 s, and the test binaries in 32 s against 17-19 s.
[profile.dev.package."*"]
opt-level = 2
debug-assertions = false
overflow-checks = false

[profile.dev.package.mtgish-ast]
debug-assertions = false

# rust_syntax is unoptimized, and generic code it instantiates (serde_json's
# writer, slices) is shared with mtgish-ast: without debug assertions it runs
# without the standard library's checks, 15% of `ast cantrip-tracked`.
[profile.dev.package.rust_syntax]
debug-assertions = false

[features]
legacy-cli = []
ronl_to_bincode = ["legacy-cli"]
ronl_to_pretty_ron = ["legacy-cli"]
write_out_json = ["legacy-cli"]

[[bin]]
name = "rust_syntax"
path = "src/main.rs"
required-features = ["legacy-cli"]
