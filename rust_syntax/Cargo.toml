[package]
name = "rust_syntax"
version = "0.0.1"
edition = "2021"

[workspace]
members = ["normalize"]
resolver = "2"

[dependencies]
# Serialize/Deserialize, needed for RON
serde = { version = "1.0.217", features = ["derive"] }

# Adds skip_serializing_if, and unwrap_or_skip
serde_with = "3.12.0"

# Serde input/output formats
serde_json = "1.0.134"
ron = "0.8.1"

# Typescript types from Rust types
ts-rs = { version = "10.1", features = ["no-serde-warnings"] }

# Non-Serde binary Serialize/Deserialize
bincode = "2.0.1"
sha2 = "0.10"

[profile.dev]
incremental = true
debug = 0

# Corpus runs spend their time in generic serde and lowering code. Optimizing
# everything except rust_syntax, whose derives are slow to optimize, keeps
# builds fast while making full checks much faster.
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.mtgish-ast]
opt-level = 1
debug-assertions = false

[features]
legacy-cli = []
ronl_to_bincode = ["legacy-cli"]
ronl_to_pretty_ron = ["legacy-cli"]
write_out_json = ["legacy-cli"]

[[bin]]
name = "rust_syntax"
path = "src/main.rs"
required-features = ["legacy-cli"]
