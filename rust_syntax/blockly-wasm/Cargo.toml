[package]
name = "mtgish-blockly-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
oracle-ir-contract = { git = "https://github.com/vishvananda/oracle-grammar.git", rev = "4174f5e4fa73ff569dccb931a61a63004323d22e", default-features = false }
serde = "1"
serde_json = { version = "1", features = ["unbounded_depth"] }
wasm-bindgen = "=0.2.127"
