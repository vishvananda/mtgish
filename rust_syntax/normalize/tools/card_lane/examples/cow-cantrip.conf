# Optional cow-worktree configuration. Replace each /path value for your machine.
# The normal Git + explicit reflink preparation in SETUP.md needs no custom git shim.
COW_IMG=none
COW_MNT=/path/to/btrfs
COW_BASE=/path/to/btrfs/base/cantrip
COW_BASE_REF=YOUR_COMPATIBLE_BASE_REF
COW_GITDIR=/path/to/cantrip/.git
COW_REMOTE=git@github.com:cantrip-rs/cantrip-rs.git
COW_META_DIR=/path/to/btrfs/.cow-meta-cantrip
COW_WT_DIR=/path/to/btrfs/.cow-worktrees-cantrip
COW_WORK_DIR=/path/to/btrfs/card-workers
COW_PLACEMENT=direct
COW_SOURCE=base
COW_CLEAN=1
COW_KEEP="target"
COW_RECLAIM_BAZEL=0
