[package]
name = "mtgish-ast"
version = "0.1.0"
edition = "2021"
build = "src/build_tokens.rs"

[features]
default = []
cantrip = []

[dependencies]
rust_syntax = { path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ron = "0.8.1"
bincode = "2.0.1"
syn = { version = "2", features = ["full"] }
quote = "1"

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full"] }

[[bin]]
name = "ast"
path = "src/bin/ast.rs"
