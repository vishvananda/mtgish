[package]
name = "mtgish-ast"
version = "0.1.0"
edition = "2021"
build = "src/build_tokens.rs"

[features]
default = ["legacy"]
legacy = []
cantrip = ["legacy", "dep:prettyplease"]

[dependencies]
oracle-ir-contract = { version = "=0.2.0", default-features = false }
rust_syntax = { path = ".." }
mtgish-ir = { path = "../ir" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["unbounded_depth"] }
ron = "0.8.1"
bincode = "2.0.1"
syn = { version = "2", features = ["full", "visit", "visit-mut"] }
quote = "1"
proc-macro2 = "1"
prettyplease = { version = "0.2", optional = true }

[build-dependencies]
oracle-ir-contract = { version = "=0.2.0", default-features = false }
oracle-ir = { version = "=0.2.0", default-features = false }
quote = "1"
proc-macro2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full"] }

[[bin]]
name = "ast"
path = "src/bin/ast.rs"
required-features = ["legacy"]

[[bin]]
name = "blockly_catalog"
path = "src/bin/blockly_catalog.rs"
required-features = ["legacy"]

[dev-dependencies]
# Exercise object-key invariance under the consuming frontend feature union.
serde_json = { version = "1", features = ["preserve_order", "unbounded_depth"] }
