[package]
name = "mtgish-ast"
version = "0.1.0"
edition = "2021"
build = "src/build_tokens.rs"

[features]
default = ["legacy"]
legacy = []
cantrip = ["legacy", "dep:prettyplease"]

[dependencies]
mtgish-ir = { path = "../ir" }
# Source AST is frozen independently of normalized-IR work. It is byte-identical
# to the parent source at this split; new IR revisions can reuse this build.
# Updating source enums also requires updating this explicit published revision.
rust_syntax = { git = "ssh://git@github.com/vishvananda/mtgish.git", rev = "2a7fc07c42002a3365b14a3b7a4135ff7641cb62" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
ron = "0.8.1"
bincode = "2.0.1"
syn = { version = "2", features = ["full", "visit", "visit-mut"] }
quote = "1"
proc-macro2 = "1"
prettyplease = { version = "0.2", optional = true }

[build-dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
syn = { version = "2", features = ["full"] }

[[bin]]
name = "ast"
path = "src/bin/ast.rs"
required-features = ["legacy"]
