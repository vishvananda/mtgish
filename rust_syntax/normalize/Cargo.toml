[package]
name = "mtgish-ast"
version = "0.1.0"
edition = "2021"
build = "src/build_tokens.rs"

[features]
default = ["legacy"]
legacy = []
cantrip = ["legacy", "dep:prettyplease"]

[dependencies]
rust_syntax = { git = "ssh://git@github.com/vishvananda/mtgish.git", rev = "34b1856c4916eb87813e75bdcdecd2d94a4ec13e" }
mtgish-ir = { git = "ssh://git@github.com/vishvananda/mtgish.git", rev = "106840242b3a5d574c5bb402982a7886d2dced48" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ron = "0.8.1"
bincode = "2.0.1"
syn = { version = "2", features = ["full", "visit", "visit-mut"] }
quote = "1"
proc-macro2 = "1"
prettyplease = { version = "0.2", optional = true }

[build-dependencies]
quote = "1"
proc-macro2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full"] }

[[bin]]
name = "ast"
path = "src/bin/ast.rs"
required-features = ["legacy"]
